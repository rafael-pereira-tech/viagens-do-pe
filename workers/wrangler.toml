name = "viagens-do-pe-ingest"
main = "src/index.ts"
compatibility_date = "2026-09-11"
workers_dev = true

# Cron triggers are always evaluated in UTC by Cloudflare.
# 00:00 / 06:00 / 12:00 / 18:00 UTC =
# 21:00 / 03:00 / 09:00 / 15:00 America/Sao_Paulo (UTC-3; Brazil has no DST).
[triggers]
crons = ["0 0 * * *", "0 6 * * *", "0 12 * * *", "0 18 * * *"]

# Secrets (set locally in .dev.vars, in prod via `wrangler secret put`):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   INGEST_TRIGGER_SECRET   (optional; required to authorize POST /run)
#   SMILES_API_KEY          (BE-3 guest miles search; SPA x-api-key from DevTools)
#   SMILES_MEMBER_NUMBER    (9-digit Smiles number; empty = guest)
#   SMILES_PASSWORD         (4-digit unified GOL+Smiles password)
#   SMILES_COOKIE / SMILES_ACCESS_TOKEN  (optional member session)
#
# Optional non-secret overrides can be added under [vars] later:
#   FLIGHT_WINDOW_START, FLIGHT_WINDOW_END
#   SMILES_DRY_RUN=1   (fixture parser, no live Smiles/VoeGol)
#   SMILES_ENV=green|blue   (default green)
#   SMILES_REQUEST_DELAY_MS
#   VOEGOL_DISABLED=1
