name = "viagens-do-pe-ingest"
main = "src/index.ts"
compatibility_date = "2026-09-11"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

# Sentry release from Cloudflare deployment version (optional; DSN is a secret).
[version_metadata]
binding = "CF_VERSION_METADATA"

# FE product events (POST /api/v1/events). Query via Analytics Engine SQL API.
[[analytics_engine_datasets]]
binding = "USER_EVENTS"
dataset = "user_events"

# Cron triggers are always evaluated in UTC by Cloudflare.
# 09:00 / 21:00 UTC = 06:00 / 18:00 America/Sao_Paulo (UTC-3).
[triggers]
crons = ["0 9 * * *", "0 21 * * *"]

[vars]
ENVIRONMENT = "production"
FLIGHT_WINDOW_ROLLING = "1"
FLIGHT_WINDOW_DAYS = "45"
ROUTE_POA_ENABLED = "0"
CURRENT_READ_MODEL = "1"
SMILES_POINTS_ENABLED = "1"
GOL_CASH_ENABLED = "1"
AZUL_POINTS_ENABLED = "1"
AZUL_CASH_ENABLED = "1"
LATAM_CASH_ENABLED = "1"
LATAM_PASS_POINTS_ENABLED = "0"

[env.staging]
name = "viagens-do-pe-ingest-staging"
workers_dev = true
[[env.staging.analytics_engine_datasets]]
binding = "USER_EVENTS"
dataset = "user_events"
[env.staging.vars]
ENVIRONMENT = "staging"
FLIGHT_WINDOW_ROLLING = "0"
FLIGHT_WINDOW_DAYS = "45"
ROUTE_POA_ENABLED = "0"
CURRENT_READ_MODEL = "1"
SMILES_POINTS_ENABLED = "1"
GOL_CASH_ENABLED = "1"
AZUL_POINTS_ENABLED = "1"
AZUL_CASH_ENABLED = "1"
LATAM_CASH_ENABLED = "1"
LATAM_PASS_POINTS_ENABLED = "0"

# Secrets (set locally in .dev.vars, in prod via `wrangler secret put`):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   INGEST_TRIGGER_SECRET   (optional; required to authorize POST /run)
#   READ_API_KEY            (required for GET /api/v1/snapshots*; not INGEST_TRIGGER_SECRET)
#   SENTRY_DSN              (optional; ingest + uncaught Worker errors)
#   SMILES_API_KEY          (BE-3 guest search; SPA x-api-key from DevTools)
#   SMILES_COOKIE / SMILES_ACCESS_TOKEN / SMILES_USER / SMILES_PASS  (optional member)
#   TUDOAZUL_LOGIN / TUDOAZUL_PASSWORD  (BE-4 frozen secrets; placeholders only)
#   LATAM_PASS_LOGIN / LATAM_PASS_PASSWORD  (BE-5 frozen secrets; placeholders only)
#   Guest capability flags are non-secret and are defined in [vars]:
#   SMILES_POINTS_ENABLED, GOL_CASH_ENABLED, AZUL_POINTS_ENABLED,
#   AZUL_CASH_ENABLED, LATAM_CASH_ENABLED, LATAM_PASS_POINTS_ENABLED
#
# Optional non-secret overrides can be added under [vars] later:
#   FLIGHT_WINDOW_START, FLIGHT_WINDOW_END
#   SMILES_DRY_RUN=1   (fixture parser, no live Smiles / VoeGol)
#   SMILES_ENV=blue|green
#   SMILES_REQUEST_DELAY_MS
#   VOEGOL_API_HOST
#   TUDOAZUL_DRY_RUN=1 (fixture parser, no live Azul)
#   TUDOAZUL_API_HOST / TUDOAZUL_REQUEST_DELAY_MS
#   LATAM_DRY_RUN=1    (fixture parser, no live LATAM)
#   LATAM_API_HOST / LATAM_OFFERS_PATH / LATAM_LOGIN_PATH / LATAM_REQUEST_DELAY_MS
#   CORS_ALLOWED_ORIGINS   (extra dashboard origins, comma-separated)
